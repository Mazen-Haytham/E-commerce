version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI — http://localhost:15672 (guest/guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - backend_net
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Express Backend Application
  backend:
    build:
      context: .
      dockerfile: dockerfile
    container_name: backend
    depends_on:
      postgres:
        condition: service_healthy
      inventory-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    ports:
      - "3000:3000"
    networks:
      - backend_net
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./inventory-service:/app/inventory-service
    # Run migrations before starting the app
    command: sh -c "npm run prisma:migrate && npm run dev"

  inventory-postgres:
    image: postgres:18
    container_name: inventory-postgres
    environment:
      POSTGRES_USER: ${INVENTORY_POSTGRES_USER}
      POSTGRES_PASSWORD: ${INVENTORY_POSTGRES_PASSWORD}
      POSTGRES_DB: ${INVENTORY_POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - inventory_postgres_data:/var/lib/postgresql
    networks:
      - backend_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${INVENTORY_POSTGRES_USER} -d ${INVENTORY_POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  inventory-migrate:
    build:
      context: .
      dockerfile: dockerfile
    container_name: inventory-migrate
    depends_on:
      inventory-postgres:
        condition: service_healthy
    environment:
      INVENTORY_DATABASE_URL: ${INVENTORY_DATABASE_URL}
    command: npx prisma migrate deploy --config inventory-service/prisma.config.ts
    networks:
      - backend_net

  inventory-app:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: inventory-app
    depends_on:
      inventory-postgres:
        condition: service_healthy
    env_file: .env
    environment:
      INVENTORY_SERVICE_PORT: ${INVENTORY_SERVICE_PORT:-3001}
    ports:
      - "3001:3001"
    networks:
      - backend_net

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  inventory_postgres_data:

networks:
  backend_net:
    driver: bridge
